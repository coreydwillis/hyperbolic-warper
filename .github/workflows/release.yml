name: Release

# Only builds when the app's <Version> in HyperbolicWarper.App.csproj actually
# changes on main, so pushing regular code changes does not trigger a build.
# Bump the version and push to main (or merge a PR that does) to cut a release.
# workflow_dispatch is available as a manual override, e.g. to retry a failed run.
on:
  push:
    branches: [main]
    paths:
      - "src/HyperbolicWarper.App/HyperbolicWarper.App.csproj"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.diff.outputs.version }}
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check whether the app version changed
        id: diff
        env:
          CSPROJ: src/HyperbolicWarper.App/HyperbolicWarper.App.csproj
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          current=$(grep -oP '(?<=<Version>).*(?=</Version>)' "$CSPROJ")
          echo "version=$current" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manually triggered, building v$current."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous=""
          if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            previous=$(git show "$BEFORE_SHA:$CSPROJ" 2>/dev/null | grep -oP '(?<=<Version>).*(?=</Version>)' || echo "")
          fi

          if [ "$current" != "$previous" ]; then
            echo "Version changed: $previous -> $current"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version unchanged ($current), skipping release."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-release:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"

      # Each step restores for itself instead of sharing one upfront `dotnet restore`. A prior
      # release produced a self-contained build whose deps.json was missing several WindowsAppSDK
      # runtime entries a working build had, despite pinned package versions and an otherwise
      # identical restore+publish sequence reproduced locally. Restoring once and reusing that
      # state across separately-scoped commands (solution-level restore, then a differently-scoped
      # publish) is a plausible source of that inconsistency; letting each command own its restore
      # removes the shared state instead of relying on further version pins to route around it.
      - name: Test
        run: dotnet test tests/HyperbolicWarper.Core.Tests/HyperbolicWarper.Core.Tests.csproj --configuration Release

      - name: Publish
        # PublishSingleFile + IncludeAllContentForSelfExtract + WindowsAppSDKSelfContained bundle
        # everything (including the Windows App SDK runtime) into one .exe instead of a folder full
        # of DLLs. PublishTrimmed/PublishReadyToRun must be disabled here on the command line, not in
        # the csproj: self-contained publish trims by default, and trimming strips managed types that
        # are only ever reached through XAML reflection (value converters instantiated via
        # StaticResource, never "new"'d from C#), which crashes at runtime. See the csproj for details.
        run: >
          dotnet publish src/HyperbolicWarper.App/HyperbolicWarper.App.csproj
          --configuration Release
          -p:Platform=x64
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeAllContentForSelfExtract=true
          -p:WindowsAppSDKSelfContained=true
          -p:PublishTrimmed=false
          -p:PublishReadyToRun=false
          -p:DebugType=none
          -o publish/win-x64

      - name: Rename the published exe
        shell: pwsh
        run: Move-Item "publish/win-x64/HyperbolicWarper.App.exe" "HyperbolicWarper-$env:VERSION-win-x64.exe"

      # Two prior releases from this workflow built successfully but crashed on launch for reasons
      # that only showed up outside this exact CI run (a trimming issue, then non-reproducible
      # NuGet dependency resolution) despite passing locally. Actually launching the built exe here
      # and confirming it survives is the only check that would have caught either of those before
      # they shipped, so it gates the release regardless of what future issue might cause a crash.
      - name: Smoke-test the published exe
        shell: pwsh
        run: |
          $exePath = Join-Path (Get-Location) "HyperbolicWarper-$env:VERSION-win-x64.exe"
          $proc = Start-Process -FilePath $exePath -PassThru
          Start-Sleep -Seconds 10
          $stillRunning = Get-Process -Id $proc.Id -ErrorAction SilentlyContinue
          if (-not $stillRunning) {
            Write-Error "The published exe was no longer running 10 seconds after launch, meaning it crashed on startup. Refusing to publish a release."
            exit 1
          }
          Write-Host "Smoke test passed: PID $($proc.Id) is still running 10 seconds after launch."
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $tag already exists, skipping."
            exit 0
          fi

          # A hyphen marks a semver pre-release (e.g. 0.1.0-alpha), which GitHub
          # should flag as a pre-release rather than a stable release.
          prerelease_flag=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease_flag=(--prerelease)
          fi

          gh release create "$tag" "HyperbolicWarper-$VERSION-win-x64.exe" \
            --repo "${{ github.repository }}" \
            --title "$tag" \
            --generate-notes \
            "${prerelease_flag[@]}"
