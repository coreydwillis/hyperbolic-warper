name: Release

# Only builds when the app's <Version> in HyperbolicWarper.App.csproj actually
# changes on main, so pushing regular code changes does not trigger a build.
# Bump the version and push to main (or merge a PR that does) to cut a release.
# workflow_dispatch is available as a manual override, e.g. to retry a failed run.
on:
  push:
    branches: [main]
    paths:
      - "src/HyperbolicWarper.App/HyperbolicWarper.App.csproj"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.diff.outputs.version }}
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether the app version changed
        id: diff
        env:
          CSPROJ: src/HyperbolicWarper.App/HyperbolicWarper.App.csproj
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          current=$(grep -oP '(?<=<Version>).*(?=</Version>)' "$CSPROJ")
          echo "version=$current" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manually triggered, building v$current."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous=""
          if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            previous=$(git show "$BEFORE_SHA:$CSPROJ" 2>/dev/null | grep -oP '(?<=<Version>).*(?=</Version>)' || echo "")
          fi

          if [ "$current" != "$previous" ]; then
            echo "Version changed: $previous -> $current"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version unchanged ($current), skipping release."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-release:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore HyperbolicWarper.sln -p:Platform=x64

      - name: Test
        run: dotnet test tests/HyperbolicWarper.Core.Tests/HyperbolicWarper.Core.Tests.csproj --configuration Release --no-restore

      - name: Publish
        run: >
          dotnet publish src/HyperbolicWarper.App/HyperbolicWarper.App.csproj
          --configuration Release
          -p:Platform=x64
          -r win-x64
          --self-contained true
          -o publish/win-x64

      - name: Zip build output
        shell: pwsh
        run: Compress-Archive -Path publish/win-x64/* -DestinationPath "HyperbolicWarper-$env:VERSION-win-x64.zip"

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $tag already exists, skipping."
            exit 0
          fi
          gh release create "$tag" "HyperbolicWarper-$VERSION-win-x64.zip" \
            --repo "${{ github.repository }}" \
            --title "$tag" \
            --generate-notes
